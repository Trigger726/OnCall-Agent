# Optional explicit Collector -> Incident path, not the offline default.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/otel-collector-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["collector-alertmanager:9093"]
scrape_configs:
  - job_name: opspilot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["opspilot:9920"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          resource_code: OBS-OTEL-COLLECTOR
