global:
  scrape_interval: 2s
  scrape_timeout: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: opspilot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["opspilot:9920"]
