# Test-only fault size and cadence. Generate both cadence copies from the real
# deploy configs; the native rule file and route/auth/mapping are not rewritten.
services:
  otel-collector:
    command:
      - --config=/etc/otelcol-contrib/config.yml
      - --config=/etc/otelcol-contrib/saturation-test.yml
    ports:
      - "127.0.0.1:18888:8888"
    volumes:
      - ./integration/tracing/otel-collector-saturation-test.yml:/etc/otelcol-contrib/saturation-test.yml:ro
  prometheus:
    volumes:
      - ./target/collector-alerting-it/prometheus-test.yml:/etc/prometheus/prometheus.yml:ro
  collector-alertmanager:
    volumes:
      - ./target/collector-alerting-it/alertmanager-test.yml:/etc/alertmanager/alertmanager.yml:ro
