name: Plan membership WIP verification

# Shared cases, populated upgrade, two-JVM HTTP and browser evidence remain separate.
on:
  push:
    branches: ["wip/plan-membership-v39-20261010"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-membership-wip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-notification-ui:
    name: Read-only open notification real browser and late response fences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/browser/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build fresh own-source frontend and JAR
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
          bash mvnw -B -DskipTests package
      - name: Install pinned Chromium and inspect notification UI gates
        run: |
          npm ci --prefix scripts/browser
          node scripts/browser/node_modules/playwright/cli.js install --with-deps chromium
          node --test scripts/tests/oncall-open-notification-ui.test.cjs
      - name: Verify five actual notification states and stale-response protections
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-open-notification-ui-it
          node scripts/verify-oncall-open-notification-ui-ci.cjs 2>&1 | tee target/oncall-open-notification-ui-it/runner.log
          node -e 'const fs=require("fs"),d="target/oncall-open-notification-ui-it";const r=JSON.parse(fs.readFileSync(d+"/runner.log","utf8").split(/\r?\n/).find(l=>l.startsWith("{")));require("child_process").execFileSync(process.execPath,["scripts/verify-oncall-open-notification-ui-evidence.cjs",r.evidenceDirectory],{stdio:"inherit"});'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-notification-ui-evidence
          path: |
            target/oncall-open-notification-ui-it/**/*.json
            target/oncall-open-notification-ui-it/**/*.log
            target/oncall-open-notification-ui-it/**/*.png
          retention-days: 30

  open-notification-jar:
    name: Populated V40 to V41 notification JAR HTTP and durable restart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect actual H2 proof and rejection cases
        run: node --test scripts/tests/oncall-open-notification-http.test.cjs
      - name: Build own-source current JAR
        run: bash mvnw -B -DskipTests package
      - name: Immutable original V40 checkout
        uses: actions/checkout@v5
        with:
          ref: 83a6842f2218427fa4de401ff0f3af40d96f9b97
          path: target/cp118-v40-source
      - name: Build clean original V40 package and record provenance
        run: |
          (cd target/cp118-v40-source && bash mvnw -B -DskipTests package)
          node scripts/record-open-notification-baseline.cjs
      - name: Execute real receiver HTTP retries upgrade and restart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-open-notification-http-it
          node scripts/verify-oncall-open-notification-http-ci.cjs 2>&1 | tee target/oncall-open-notification-http-it/runner.log
          node -e 'const fs=require("fs"),p=require("path"),d="target/oncall-open-notification-http-it";const r=JSON.parse(fs.readFileSync(d+"/runner.log","utf8").split(/\r?\n/).find(l=>l.startsWith("{")));require("child_process").execFileSync(process.execPath,["scripts/verify-oncall-open-notification-http-evidence.cjs",r.evidenceDirectory],{stdio:"inherit"});'
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-notification-jar-evidence
          path: |
            target/oncall-open-notification-http-it/**/*.json
            target/oncall-open-notification-http-it/**/*.log
          retention-days: 30

  membership-mysql:
    name: Plan membership shared cases on owned MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check positive and negative evidence gates
        run: node --test scripts/tests/oncall-plan-membership-mysql.test.cjs
      - name: Execute all membership cases against independent MySQL
        shell: bash
        run: |
          set -o pipefail
          chmod +x mvnw
          mkdir -p target/oncall-plan-membership-mysql-it
          ./mvnw -B -Duser.timezone=UTC -Dopspilot.mysql.it.enabled=true -Dtest=MySqlOnCallPlanMembershipIntegrationTest test 2>&1 | tee target/oncall-plan-membership-mysql-it/maven.log
      - name: Verify cases, V39, actual SQL lock waits and complete pool shutdown
        run: node scripts/verify-oncall-plan-membership-mysql.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plan-membership-wip-mysql-evidence
          path: |
            target/oncall-plan-membership-mysql-it/
            target/surefire-reports/
          retention-days: 30

  publication-upgrade-mysql:
    name: Nonempty V39 to current V41 publication HTTP and restart on owned MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Gate compares immutable CP115 V1-V40 blobs, including unmodified published V40.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check publication upgrade evidence gates
        run: node --test scripts/tests/oncall-open-publication-upgrade.test.cjs
      - name: Build own-source current JAR
        run: bash mvnw -B -DskipTests package
      - name: Immutable old V39 checkout
        uses: actions/checkout@v5
        with:
          ref: 915e3f29557bd8019c79793b12f73f990215ad71
          path: target/cp116-v39-source
      - name: Build actual original V39 JAR and record clean provenance
        run: |
          (cd target/cp116-v39-source && bash mvnw -B -DskipTests package)
          node scripts/record-open-publication-upgrade-baseline.cjs
      - name: Exercise populated upgrade real publication endpoint and restart
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-open-publication-upgrade-mysql-it
          bash mvnw -B -Duser.timezone=UTC -Dopspilot.oncall.publication.upgrade.mysql.enabled=true -Dtest=MySqlOpenPublicationUpgradeHttpIntegrationTest test 2>&1 | tee target/oncall-open-publication-upgrade-mysql-it/maven.log
      - name: Verify persisted snapshots original checksums and all owned cleanup
        run: node scripts/verify-oncall-open-publication-upgrade-mysql.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-publication-upgrade-mysql-evidence
          path: |
            target/oncall-open-publication-upgrade-mysql-it/**/*.json
            target/oncall-open-publication-upgrade-mysql-it/**/*.log
            target/surefire-reports/TEST-org.trigger.opspilot.oncall.MySqlOpenPublicationUpgradeHttpIntegrationTest.xml
            target/cp116-v39-source/old-v39-jar-provenance.json
          retention-days: 30

  membership-ui:
    name: Plan membership real browser identity and original receipts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # The strict original 14-case comparison reads the immutable CP113 commit.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/browser/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build fresh frontend and own-source JAR
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
          bash mvnw -B -DskipTests package
      - name: Install repository pinned Chromium and inspect gates
        run: |
          npm ci --prefix scripts/browser
          node scripts/browser/node_modules/playwright/cli.js install --with-deps chromium
          node --test scripts/tests/oncall-plan-membership-ui.test.cjs
      - name: Exercise actual permission receipts and late response identity fences
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-plan-membership-ui-it
          node scripts/verify-oncall-plan-membership-ui-ci.cjs 2>&1 | tee target/oncall-plan-membership-ui-it/runner.log
          folder=$(sed -n 's/^PLAN_MEMBERSHIP_UI_RESULT //p' target/oncall-plan-membership-ui-it/runner.log)
          node scripts/verify-oncall-plan-membership-ui-evidence.cjs "$(dirname "$folder")"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plan-membership-ui-evidence
          path: |
            target/oncall-plan-membership-ui-it/**/*.json
            target/oncall-plan-membership-ui-it/**/*.log
            target/oncall-plan-membership-ui-it/**/*.png
          retention-days: 30

  membership-cross-node-mysql:
    name: Two JVM plan membership on owned MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify positive and negative two-node evidence gates
        run: node --test scripts/tests/oncall-plan-membership-cross-node.test.cjs
      - name: Build actual own-source executable JAR
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Execute shared real HTTP scenarios on two live JVMs and owned MySQL
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-plan-membership-cross-node-mysql-it
          ./mvnw -B -Duser.timezone=UTC -Dopspilot.oncall.membership.cross-node.mysql.enabled=true -Dtest=MySqlOnCallPlanMembershipCrossNodeIntegrationTest test 2>&1 | tee target/oncall-plan-membership-cross-node-mysql-it/maven.log
      - name: Verify six HTTP cases original receipts SQL counts and three pool shutdowns
        run: node scripts/verify-oncall-plan-membership-cross-node.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plan-membership-cross-node-mysql-evidence
          path: |
            target/oncall-plan-membership-cross-node-mysql-it/**/*.json
            target/oncall-plan-membership-cross-node-mysql-it/**/*.log
            target/surefire-reports/TEST-org.trigger.opspilot.oncall.MySqlOnCallPlanMembershipCrossNodeIntegrationTest.xml
          retention-days: 30

  membership-upgrade-mysql:
    name: Populated V38 to current V41 JAR upgrade on owned MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify strict upgrade evidence gate
        run: node --test scripts/tests/oncall-plan-membership-upgrade-mysql.test.cjs
      - name: Build fresh own-source JAR
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Immutable original V38 checkout
        uses: actions/checkout@v5
        with:
          ref: ce5fc51aee215e4eebccfd9e02bccf5271f6fea5
          path: target/cp110-v38-source
      - name: Build actual old V38 JAR and verify provenance
        run: |
          (cd target/cp110-v38-source && bash mvnw -B -DskipTests package)
          node scripts/record-plan-membership-upgrade-baseline.cjs
      - name: Execute nonempty original V38 to fresh V41 on owned MySQL
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-plan-membership-upgrade-mysql-it
          ./mvnw -B -Duser.timezone=UTC -Dopspilot.oncall.membership.upgrade.mysql.enabled=true -Dtest=MySqlPlanMembershipUpgradeHttpIntegrationTest test 2>&1 | tee target/oncall-plan-membership-upgrade-mysql-it/maven.log
      - name: Inspect JDBC, all 38 checksums, receipts, five JVM pools and owned container shutdown
        run: node scripts/verify-oncall-plan-membership-upgrade-mysql.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plan-membership-upgrade-mysql-evidence
          path: |
            target/oncall-plan-membership-upgrade-mysql-it/**/*.json
            target/oncall-plan-membership-upgrade-mysql-it/**/*.log
            target/surefire-reports/TEST-org.trigger.opspilot.oncall.MySqlPlanMembershipUpgradeHttpIntegrationTest.xml
            target/cp110-v38-source/old-v38-jar-provenance.json
          retention-days: 30

  open-recipient-mysql:
    name: Open publication and recipient eligibility on owned MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect recipient evidence gates
        run: node --test scripts/tests/oncall-open-handoff-recipients.test.cjs
      - name: Execute shared production services on test-owned MySQL
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-open-recipient-mysql-it
          bash mvnw -B -Duser.timezone=UTC -Dopspilot.mysql.it.enabled=true -Dtest=MySqlOnCallOpenHandoffRecipientIntegrationTest test 2>&1 | tee target/oncall-open-recipient-mysql-it/maven.log
      - name: Verify all 14 cases current SQL identity and complete shutdown
        run: node scripts/verify-oncall-open-handoff-recipients.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-recipient-mysql-evidence
          path: |
            target/oncall-open-recipient-mysql-it/
            target/surefire-reports/TEST-org.trigger.opspilot.oncall.MySqlOnCallOpenHandoffRecipientIntegrationTest.xml
          retention-days: 30

  open-notification-mysql:
    name: Durable open publication webhook transport on owned MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Inspect notification positive and negative gates
        run: node --test scripts/tests/oncall-open-notifications.test.cjs
      - name: Execute production services real receiver HTTP and owned MySQL
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/oncall-open-notification-mysql-it
          bash mvnw -B -Duser.timezone=UTC -Dopspilot.mysql.it.enabled=true -Dtest=MySqlOnCallOpenNotificationIntegrationTest test 2>&1 | tee target/oncall-open-notification-mysql-it/maven.log
      - name: Verify exact cases observed HTTP receipts fencing and pool shutdown
        run: node scripts/verify-oncall-open-notifications.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-notification-mysql-evidence
          path: |
            target/oncall-open-notification-mysql-it/
            target/surefire-reports/TEST-org.trigger.opspilot.oncall.MySqlOnCallOpenNotificationIntegrationTest.xml
          retention-days: 30
