name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Audit full frontend dependency tree including build tools
        working-directory: web
        run: |
          mkdir -p ../target/frontend-security-it
          npm audit --registry=https://registry.npmjs.org --json > ../target/frontend-security-it/audit.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: frontend-security-evidence
          path: target/frontend-security-it/
          retention-days: 30

  browser-integration:
    name: On-call real browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            scripts/browser/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build fresh frontend and JAR
        run: |
          npm ci --prefix web
          npm run build --prefix web
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Install pinned browser and verify lifecycle helpers
        run: |
          npm ci --prefix scripts/browser
          node scripts/browser/node_modules/playwright/cli.js install --with-deps chromium
          npm test --prefix scripts/browser
      - name: Verify desktop/mobile interaction against owned isolated JAR
        run: node scripts/verify-oncall-browser-ci.cjs
      - name: Verify assistant keyed UI cancellation, response loss, queue and timeout
        run: node scripts/verify-assistant-request-ui-ci.cjs
      - name: Verify default assistant native previews, final commit and recovery
        run: node scripts/verify-assistant-native-ui-ci.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: oncall-browser-evidence
          path: |
            target/oncall-browser-it/
            target/assistant-request-ui-it/**/*.json
            target/assistant-request-ui-it/**/*.log
            target/assistant-request-ui-it/**/*.png
            target/assistant-native-ui-it/**/*.json
            target/assistant-native-ui-it/**/*.log
            target/assistant-native-ui-it/**/*.png
          retention-days: 30

  auth-session-integration:
    name: Persistent auth session revocation and JVM restart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: chmod +x mvnw
      - name: Package real application
        run: ./mvnw -B -DskipTests package
      - name: Verify actual HTTP revocation across owned JVM restart
        run: node scripts/verify-auth-session-ci.cjs
      - name: Verify existing Agent streams and late real HTTP Provider results
        run: node scripts/verify-agent-session-ci.cjs
      - name: Verify assistant HTTP revocation, mixed capacity and running/queued budgets
        run: node scripts/verify-assistant-session-ci.cjs
      - name: Verify assistant key recovery after dropped response, JVM restart and SIGKILL
        run: node scripts/verify-assistant-idempotency-ci.cjs
      - name: Verify explicit assistant cancellation, lost cancel response and queued SIGKILL recovery
        run: node scripts/verify-assistant-cancel-ci.cjs
      - name: Verify cross-node native assistant cancellation and authorization fences
        run: node scripts/verify-assistant-cross-node-ci.cjs
      - name: Verify owned Linux TCP client framing and explicit resume barrier
        run: python3 scripts/fixtures/test_assistant_slow_tcp_client.py
      - name: Verify paused TCP writes, model release and natural output capacity recovery
        run: node scripts/verify-assistant-slow-consumer-ci.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: auth-session-evidence
          path: |
            target/auth-session-it/**/*.json
            target/auth-session-it/**/*.log
            target/agent-session-it/**/*.json
            target/agent-session-it/**/*.log
            target/assistant-session-it/**/*.json
            target/assistant-session-it/**/*.log
            target/assistant-idempotency-it/**/*.json
            target/assistant-idempotency-it/**/*.log
            target/assistant-cancel-it/**/*.json
            target/assistant-cancel-it/**/*.log
            target/assistant-cross-node-it/**/*.json
            target/assistant-cross-node-it/**/*.log
            target/assistant-slow-consumer-it/**/*.json
            target/assistant-slow-consumer-it/**/*.log
            target/assistant-slow-consumer-it/**/*.txt
          retention-days: 30

  backend-h2:
    name: Backend tests and JAR (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x mvnw
      - name: Verify assistant native incremental HTTP contract
        run: |
          set -o pipefail
          mkdir -p target/assistant-native-it
          ./mvnw -B -Duser.timezone=UTC -Dtest=AssistantAiStreamingTest,AssistantNativeStreamHttpTest,AssistantStreamReaderTest,AssistantNativeEndpointIntegrationTest,AssistantNativeTransportTest,AssistantNativeHttpClientTest,AssistantStreamTransportTest test 2>&1 | tee target/assistant-native-it/maven.log
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantAiStreamingTest.xml target/assistant-native-it/
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantNativeStreamHttpTest.xml target/assistant-native-it/
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantStreamReaderTest.xml target/assistant-native-it/
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantNativeEndpointIntegrationTest.xml target/assistant-native-it/
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantNativeTransportTest.xml target/assistant-native-it/
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantNativeHttpClientTest.xml target/assistant-native-it/
          cp target/surefire-reports/TEST-org.trigger.opspilot.assistant.AssistantStreamTransportTest.xml target/assistant-native-it/
      - name: Test and package (UTC)
        run: ./mvnw -B -Duser.timezone=UTC package
      - name: Regression tests (Asia/Shanghai)
        run: ./mvnw -B -Duser.timezone=Asia/Shanghai test
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: assistant-native-contract-evidence
          path: target/assistant-native-it/
          retention-days: 30

  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x mvnw
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test MySQL lifecycle gate
        run: node --test scripts/tests/mysql-lifecycle.test.cjs
      - name: Run Testcontainers compatibility test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/mysql-it
          ./mvnw -B \
            -Dopspilot.mysql.it.enabled=true \
            -Dtest=MySqlCompatibilityIntegrationTest,MySqlOnCallRoutingSnapshotIntegrationTest,MySqlOnCallRotationIntegrationTest,MySqlOnCallCoverageIntegrationTest,MySqlOnCallHandoffIntegrationTest \
            test 2>&1 | tee target/mysql-it/maven.log
      - name: Verify complete MySQL logs and shutdown
        run: node scripts/verify-mysql-lifecycle.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-compatibility-evidence
          path: |
            target/surefire-reports/
            target/mysql-it/

  alertmanager-integration:
    name: Alertmanager webhook integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify real Alertmanager delivery and resolution
        run: bash scripts/verify-alertmanager-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alertmanager-pipeline-evidence
          path: target/alertmanager-it/

  prometheus-alerting-integration:
    name: Prometheus rule to Alertmanager integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify rule evaluation and resolution through Alertmanager
        run: bash scripts/verify-prometheus-alerting-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prometheus-alerting-evidence
          path: target/prometheus-alerting-it/

  service-metrics-alerting-integration:
    name: OpsPilot service metric to Incident integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify HTTP metric rule and resolution through Alertmanager
        run: bash scripts/verify-service-metrics-alerting-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-metrics-alerting-evidence
          path: target/service-metrics-it/

  follow-up-notification-integration:
    name: Follow-up notification delivery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify separate receiver, transient retry and scan idempotency
        run: bash scripts/verify-follow-up-notification-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: follow-up-notification-evidence
          path: target/follow-up-notification-it/

  container-image:
    name: Container image build and smoke test
    needs: [frontend, browser-integration, backend-h2, mysql-integration, auth-session-integration, alertmanager-integration, prometheus-alerting-integration, service-metrics-alerting-integration, slo-alerting-integration, follow-up-notification-integration, redis-integration, distributed-integration, tracing-integration, collector-alerting-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and start image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f opspilot-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build --tag opspilot:ci .
          docker run --detach --name opspilot-ci --publish 9912:9900 --publish 127.0.0.1:9920:9920 --env MANAGEMENT_ADDRESS=0.0.0.0 opspilot:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9920/actuator/health | grep --quiet '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs opspilot-ci
          exit 1

  redis-integration:
    name: Redis Streams relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dopspilot.redis.it.enabled=true -Dtest=RedisRelayIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis-agent-evidence
          path: |
            target/redis-it/
            target/surefire-reports/

  slo-alerting-integration:
    name: Native SLO rules and Alertmanager lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build fresh JAR
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Install verified pinned native tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-slo-tools
          cd target/native-slo-tools
          curl --fail --location --retry 3 --output prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.4.2/prometheus-3.4.2.linux-amd64.tar.gz
          echo '630177c6ad011193987904f09ffafec29d531abfeb5e43fa3714e376e5f28ddc  prometheus.tar.gz' | sha256sum --check
          tar -xzf prometheus.tar.gz
          curl --fail --location --retry 3 --output alertmanager.tar.gz https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz
          echo '265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8  alertmanager.tar.gz' | sha256sum --check
          tar -xzf alertmanager.tar.gz
          echo "OPSPILOT_PROMTOOL=$PWD/prometheus-3.4.2.linux-amd64/promtool" >> "$GITHUB_ENV"
          echo "OPSPILOT_PROMETHEUS=$PWD/prometheus-3.4.2.linux-amd64/prometheus" >> "$GITHUB_ENV"
          echo "OPSPILOT_ALERTMANAGER=$PWD/alertmanager-0.34.1.linux-amd64/alertmanager" >> "$GITHUB_ENV"
      - name: Verify captured rules with native evaluation
        run: node scripts/verify-slo-prometheus-rules.cjs
      - name: Verify firing repeated delivery and resolution
        run: node scripts/verify-slo-alerting-pipeline.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: slo-alerting-evidence
          path: |
            target/slo-rules-it/
            target/slo-pipeline-it/
          retention-days: 30

  distributed-integration:
    name: Two JVM Agent SSE integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dopspilot.distributed.it.enabled=true -Dtest=DistributedAgentEventsIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-agent-evidence
          path: |
            target/distributed-it/
            target/surefire-reports/

  tracing-integration:
    name: OpenTelemetry Collector and Tempo integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Reject incomplete and mis-parented trace fixtures
        run: bash scripts/verify-trace-assertions.sh
      - name: Verify fresh Collector counters and strict queue gauges
        run: bash scripts/verify-collector-metrics.sh
      - name: Reject saturation loss claims without independent recovery control
        run: bash scripts/verify-collector-saturation-assertions.sh
      - name: Check native Collector alert rules and boundary fixtures
        run: |
          mkdir -p target/tracing-it
          set -o pipefail
          docker run --rm -v "$PWD/deploy:/etc/opspilot:ro" -w /etc/opspilot --entrypoint /bin/promtool prom/prometheus:v3.4.2 check rules otel-collector-alerts.yml | tee target/tracing-it/alert-check.log
          docker run --rm -v "$PWD/deploy:/etc/opspilot:ro" -w /etc/opspilot --entrypoint /bin/promtool prom/prometheus:v3.4.2 test rules otel-collector-alerts.test.yml | tee target/tracing-it/alert-test.log
      - name: Verify default consumers, Collector restart and saturation feedback
        run: bash scripts/verify-tracing-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracing-pipeline-evidence
          path: target/tracing-it/

  collector-alerting-integration:
    name: Collector native alert to Incident lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify native route isolation
        run: bash scripts/verify-collector-alerting-routes.sh
      - name: Verify pinned notification metric labels
        run: bash scripts/verify-collector-alertmanager-metrics.sh
      - name: Verify fault, CMDB rejection, native repeat and same-ID resolution
        run: bash scripts/verify-collector-alerting-pipeline.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: collector-alerting-evidence
          path: target/collector-alerting-it/
          retention-days: 30
