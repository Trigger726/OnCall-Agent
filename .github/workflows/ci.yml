name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        run: npm ci && npm test && npm run build

  backend-h2:
    name: Backend tests and JAR (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x mvnw
      - name: Test and package
        run: ./mvnw -B package

  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x mvnw
      - name: Run Testcontainers compatibility test
        run: >-
          ./mvnw -B
          -Dopspilot.mysql.it.enabled=true
          -Dtest=MySqlCompatibilityIntegrationTest
          test

  container-image:
    name: Container image build and smoke test
    needs: [frontend, backend-h2, mysql-integration, redis-integration, distributed-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and start image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f opspilot-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build --tag opspilot:ci .
          docker run --detach --name opspilot-ci --publish 9912:9900 opspilot:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9912/actuator/health | grep --quiet '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs opspilot-ci
          exit 1

  redis-integration:
    name: Redis Streams relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dopspilot.redis.it.enabled=true -Dtest=RedisRelayIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis-agent-evidence
          path: |
            target/redis-it/
            target/surefire-reports/

  distributed-integration:
    name: Two JVM Agent SSE integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dopspilot.distributed.it.enabled=true -Dtest=DistributedAgentEventsIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-agent-evidence
          path: |
            target/distributed-it/
            target/surefire-reports/
