name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build
        working-directory: web
        run: npm ci && npm test && npm run build

  backend-h2:
    name: Backend tests and JAR (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x mvnw
      - name: Test and package (UTC)
        run: ./mvnw -B -Duser.timezone=UTC package
      - name: Regression tests (Asia/Shanghai)
        run: ./mvnw -B -Duser.timezone=Asia/Shanghai test

  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x mvnw
      - name: Run Testcontainers compatibility test
        run: >-
          ./mvnw -B
          -Dopspilot.mysql.it.enabled=true
          -Dtest=MySqlCompatibilityIntegrationTest,MySqlOnCallRoutingSnapshotIntegrationTest
          test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-compatibility-evidence
          path: target/surefire-reports/

  alertmanager-integration:
    name: Alertmanager webhook integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify real Alertmanager delivery and resolution
        run: bash scripts/verify-alertmanager-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alertmanager-pipeline-evidence
          path: target/alertmanager-it/

  prometheus-alerting-integration:
    name: Prometheus rule to Alertmanager integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify rule evaluation and resolution through Alertmanager
        run: bash scripts/verify-prometheus-alerting-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prometheus-alerting-evidence
          path: target/prometheus-alerting-it/

  service-metrics-alerting-integration:
    name: OpsPilot service metric to Incident integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify HTTP metric rule and resolution through Alertmanager
        run: bash scripts/verify-service-metrics-alerting-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-metrics-alerting-evidence
          path: target/service-metrics-it/

  follow-up-notification-integration:
    name: Follow-up notification delivery integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify separate receiver, transient retry and scan idempotency
        run: bash scripts/verify-follow-up-notification-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: follow-up-notification-evidence
          path: target/follow-up-notification-it/

  container-image:
    name: Container image build and smoke test
    needs: [frontend, backend-h2, mysql-integration, alertmanager-integration, prometheus-alerting-integration, service-metrics-alerting-integration, follow-up-notification-integration, redis-integration, distributed-integration, tracing-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and start image
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm -f opspilot-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker build --tag opspilot:ci .
          docker run --detach --name opspilot-ci --publish 9912:9900 --publish 127.0.0.1:9920:9920 --env MANAGEMENT_ADDRESS=0.0.0.0 opspilot:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9920/actuator/health | grep --quiet '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs opspilot-ci
          exit 1

  redis-integration:
    name: Redis Streams relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dopspilot.redis.it.enabled=true -Dtest=RedisRelayIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis-agent-evidence
          path: |
            target/redis-it/
            target/surefire-reports/

  distributed-integration:
    name: Two JVM Agent SSE integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -Dopspilot.distributed.it.enabled=true -Dtest=DistributedAgentEventsIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-agent-evidence
          path: |
            target/distributed-it/
            target/surefire-reports/

  tracing-integration:
    name: OpenTelemetry Collector and Tempo integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify normal and outage-recovery Agent traces in Tempo
        run: bash scripts/verify-tracing-pipeline.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracing-pipeline-evidence
          path: target/tracing-it/
