server:
  port: 9900
  error:
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  data:
    redis:
      connect-timeout: 2s
      timeout: 2s
  application:
    name: opspilot
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/opspilot-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:disabled}
      embedding:
        enabled: ${RUNBOOK_SEMANTIC_ENABLED:false}
        options:
          model: ${RUNBOOK_EMBEDDING_MODEL:text-embedding-v4}

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  health:
    redis:
      enabled: ${AGENT_OUTBOX_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

opspilot:
  agent:
    events:
      outbox-enabled: ${AGENT_OUTBOX_ENABLED:false}
      redis-stream: ${AGENT_EVENT_REDIS_STREAM:opspilot:agent-events}
    execution-timeout: ${AGENT_EXECUTION_TIMEOUT:60s}
    max-execution-timeout: ${AGENT_MAX_EXECUTION_TIMEOUT:5m}
    executor:
      core-pool-size: ${AGENT_CORE_POOL_SIZE:2}
      max-pool-size: ${AGENT_MAX_POOL_SIZE:4}
      queue-capacity: ${AGENT_QUEUE_CAPACITY:50}
    recovery:
      enabled: ${AGENT_RECOVERY_ENABLED:true}
      delay: ${AGENT_RECOVERY_DELAY:5000}
      initial-delay: ${AGENT_RECOVERY_INITIAL_DELAY:5000}
      batch-size: ${AGENT_RECOVERY_BATCH_SIZE:100}
  ai:
    enabled: ${AI_ENABLED:false}
  alertmanager:
    webhook:
      secret: ${ALERTMANAGER_WEBHOOK_SECRET:disabled}
      max-alerts: ${ALERTMANAGER_WEBHOOK_MAX_ALERTS:100}
    rejections:
      auto-replay-enabled: ${ALERTMANAGER_AUTO_REPLAY_ENABLED:false}
      auto-replay-delay: ${ALERTMANAGER_AUTO_REPLAY_DELAY:5000}
      auto-replay-initial-delay: ${ALERTMANAGER_AUTO_REPLAY_INITIAL_DELAY:30000}
      replay-lease: ${ALERTMANAGER_REPLAY_LEASE:30s}
      retry-base-delay: ${ALERTMANAGER_RETRY_BASE_DELAY:1m}
      retry-max-delay: ${ALERTMANAGER_RETRY_MAX_DELAY:1h}
      max-auto-replay-attempts: ${ALERTMANAGER_MAX_AUTO_REPLAY_ATTEMPTS:5}
      auto-replay-batch-size: ${ALERTMANAGER_AUTO_REPLAY_BATCH_SIZE:20}
      payload-retention: ${ALERTMANAGER_REJECTION_PAYLOAD_RETENTION:P3D}
      cleanup-batch-size: ${ALERTMANAGER_REJECTION_CLEANUP_BATCH_SIZE:500}
      cleanup-cron: "${ALERTMANAGER_REJECTION_CLEANUP_CRON:0 35 3 * * *}"
  runbook:
    semantic:
      enabled: ${RUNBOOK_SEMANTIC_ENABLED:false}
      provider: ${RUNBOOK_EMBEDDING_PROVIDER:dashscope}
      model: ${RUNBOOK_EMBEDDING_MODEL:text-embedding-v4}
      batch-size: ${RUNBOOK_EMBEDDING_BATCH_SIZE:10}
      minimum-coverage: ${RUNBOOK_EMBEDDING_MINIMUM_COVERAGE:1.0}
    retrieval:
      candidate-window: ${RUNBOOK_RETRIEVAL_CANDIDATE_WINDOW:20}
      rrf-rank-constant: ${RUNBOOK_RRF_RANK_CONSTANT:60}
      lifecycle:
        retention: ${RUNBOOK_RETRIEVAL_RETENTION:P30D}
        cleanup-batch-size: ${RUNBOOK_RETRIEVAL_CLEANUP_BATCH_SIZE:500}
        cleanup-cron: "${RUNBOOK_RETRIEVAL_CLEANUP_CRON:0 15 3 * * *}"
  postmortem:
    follow-up:
      escalation-cron: "${FOLLOW_UP_ESCALATION_CRON:0 5 9 * * *}"
      timezone: ${FOLLOW_UP_TIMEZONE:Asia/Shanghai}
      notification:
        enabled: ${FOLLOW_UP_NOTIFICATION_ENABLED:false}
        url: ${FOLLOW_UP_NOTIFICATION_URL:}
        token: ${FOLLOW_UP_NOTIFICATION_TOKEN:}
        connect-timeout: ${FOLLOW_UP_NOTIFICATION_CONNECT_TIMEOUT:2s}
        read-timeout: ${FOLLOW_UP_NOTIFICATION_READ_TIMEOUT:4s}
        retry-base-delay: ${FOLLOW_UP_NOTIFICATION_RETRY_BASE_DELAY:1m}
        retry-max-delay: ${FOLLOW_UP_NOTIFICATION_RETRY_MAX_DELAY:1h}
        lease: ${FOLLOW_UP_NOTIFICATION_LEASE:30s}
        max-attempts: ${FOLLOW_UP_NOTIFICATION_MAX_ATTEMPTS:5}
        batch-size: ${FOLLOW_UP_NOTIFICATION_BATCH_SIZE:20}
  observability:
    reliability:
      max-attempts: ${OBSERVABILITY_MAX_ATTEMPTS:2}
      backoff: ${OBSERVABILITY_RETRY_BACKOFF:150ms}
      failure-threshold: ${OBSERVABILITY_FAILURE_THRESHOLD:3}
      open-duration: ${OBSERVABILITY_OPEN_DURATION:30s}
    prometheus:
      enabled: ${PROMETHEUS_ENABLED:false}
      base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}
      query-template: ${PROMETHEUS_QUERY_TEMPLATE:up{job="%s"}}
      connect-timeout: ${PROMETHEUS_CONNECT_TIMEOUT:2s}
      read-timeout: ${PROMETHEUS_READ_TIMEOUT:4s}
    loki:
      enabled: ${LOKI_ENABLED:false}
      base-url: ${LOKI_BASE_URL:http://localhost:3100}
      query-template: ${LOKI_QUERY_TEMPLATE:{resource_code="%s"}}
      tenant-id: ${LOKI_TENANT_ID:}
      bearer-token: ${LOKI_BEARER_TOKEN:}
      connect-timeout: ${LOKI_CONNECT_TIMEOUT:2s}
      read-timeout: ${LOKI_READ_TIMEOUT:5s}
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deployment-2026}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
