services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opspilot
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot-local
      MYSQL_ROOT_PASSWORD: root-local-change-me
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  opspilot:
    build: .
    ports:
      - "9900:9900"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/opspilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: opspilot
      DB_PASSWORD: opspilot-local
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: local-compose-secret-replace-before-deployment-2026
      AI_ENABLED: "false"
      # Spring AI still validates the connection property while AI features are disabled.
      # Keep the offline Compose path bootable without injecting a real credential.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-disabled}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-false}
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://prometheus:9090}
      FOLLOW_UP_NOTIFICATION_ENABLED: ${FOLLOW_UP_NOTIFICATION_ENABLED:-false}
      FOLLOW_UP_NOTIFICATION_URL: ${FOLLOW_UP_NOTIFICATION_URL:-}
      FOLLOW_UP_NOTIFICATION_TOKEN: ${FOLLOW_UP_NOTIFICATION_TOKEN:-}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_BASE_URL: ${LOKI_BASE_URL:-http://loki:3100}
    depends_on:
      mysql:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.2
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - opspilot

  tempo-init:
    image: busybox:1.37.0
    profiles: ["tracing"]
    user: root
    entrypoint: ["chown", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.8
    profiles: ["tracing"]
    command: ["-config.file=/etc/tempo.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./deploy/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    profiles: ["tracing"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    ports:
      - "4318:4318"
      - "13133:13133"
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["tracing"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/opspilot.yml:ro
    depends_on:
      - tempo

  trace-provider-fixture:
    build:
      context: .
      dockerfile: integration/trace-provider-fixture/Dockerfile
    profiles: ["tracing-test"]
    ports:
      - "9910:9910"
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      - otel-collector

volumes:
  mysql-data:
  tempo-data:
